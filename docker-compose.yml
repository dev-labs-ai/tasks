name: tasks

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tasks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tasks}
      POSTGRES_DB: ${POSTGRES_DB:-tasks}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 images keep their data under a versioned directory
      # (/var/lib/postgresql/18/docker), so the volume is mounted one
      # level up rather than at /var/lib/postgresql/data.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 5s
      retries: 15

  # api and web are the production images; `make dev` runs only postgres
  # and starts the API and nuxt dev on the host.
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-tasks}:${POSTGRES_PASSWORD:-tasks}@postgres:5432/${POSTGRES_DB:-tasks}
      APP_ENV: production
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment:
      # A host name turns on automatic HTTPS; ":80" serves plain HTTP.
      DOMAIN: ${DOMAIN:-:80}
    ports:
      - "${WEB_PORT:-8088}:80"
    depends_on:
      - api

volumes:
  postgres-data:
