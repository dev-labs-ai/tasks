# The pipeline from the stack specification §16:
# lint → typecheck → frontend tests → backend tests → integration → e2e → build
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - name: Install web dependencies
        working-directory: apps/web
        run: bun install --frozen-lockfile

      - name: Lint
        run: |
          unformatted=$(gofmt -l apps/api)
          if [ -n "$unformatted" ]; then echo "gofmt needed:"; echo "$unformatted"; exit 1; fi
          (cd apps/api && go vet ./... && go vet -tags=integration ./...)
          (cd apps/web && bun run lint && bun run format:check)

      - name: Typecheck
        working-directory: apps/web
        run: bun run typecheck

      - name: Generated code is up to date
        run: |
          make generate
          git diff --exit-code -- apps/api/internal/repositories

  tests:
    name: Unit and integration tests
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - name: Install web dependencies
        working-directory: apps/web
        run: bun install --frozen-lockfile

      - name: Frontend tests
        working-directory: apps/web
        run: bun run test

      - name: Backend tests
        working-directory: apps/api
        run: go test -race ./...

      # Testcontainers starts PostgreSQL through the runner's Docker.
      - name: Integration tests
        working-directory: apps/api
        run: go test -race -tags=integration ./...

  e2e:
    name: End-to-end tests
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Start the production stack
        run: docker compose up -d --build --wait

      - name: Install Playwright
        working-directory: tests/e2e
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium

      - name: E2E tests
        working-directory: tests/e2e
        run: bun run test

      - name: Stack logs
        if: failure()
        run: docker compose logs

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          retention-days: 7

  build:
    name: Build images
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker compose build api web
