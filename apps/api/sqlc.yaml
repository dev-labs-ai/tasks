version: "2"
sql:
  - engine: "postgresql"
    # sqlc reads the goose migrations as the schema and skips their Down sections.
    schema: "migrations"
    queries: "queries"
    gen:
      go:
        package: "repositories"
        out: "internal/repositories"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_empty_slices: true
        overrides:
          - db_type: "timestamptz"
            go_type: "time.Time"
